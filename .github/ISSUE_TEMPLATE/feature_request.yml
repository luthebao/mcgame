name: Feature request
description: Propose a new feature, RPC, or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: client
    attributes:
      label: Flash client reference
      description: Relevant files in `docs/client/`, `Language.as` keys, or callbacks in `CallBack.as` / `CallBackGlobal.as`, if known.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Needs database changes (migration / seed)
        - label: Needs Flash client behavior to be matched exactly
        - label: Needs dashboard changes
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
